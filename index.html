<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Graphics Playground</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ecf0f1;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #2c3e50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: crosshair; /* Kursor berubah jadi tanda plus biar pas sama tema koordinat */
        }
    </style>
</head>
<body>
    //Ukuran canvas
    <canvas id="graphicsCanvas" width="800" height="500"></canvas>
    //link ke file JavaScript
    <script src="app.js"></script>
    
</body>
</html>
